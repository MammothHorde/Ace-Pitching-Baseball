kind = "mobile"
previewPath = "/"
title = "PitchPerfect"
version = "1.0.0"
id = "artifacts/pitch-perfect"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/" ]
localPort = 24309

[services.development]
run = "pnpm --filter @workspace/pitch-perfect run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/pitch-perfect", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/pitch-perfect", "run", "serve" ]

[services.env]
PORT = "24309"
BASE_PATH = "/"
